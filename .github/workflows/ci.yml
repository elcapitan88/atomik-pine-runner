name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kill: [both, timeout, memory, none]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run spike
        env:
          SPIKE_KILL: ${{ matrix.kill }}
